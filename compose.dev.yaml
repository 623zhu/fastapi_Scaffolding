services:
  backend:
    build:
      target: development
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  frontend:
    build:
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports: !override
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5173"]

volumes:
  frontend_node_modules:
