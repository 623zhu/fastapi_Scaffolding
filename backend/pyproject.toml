[project]
name = "fastapi-vue-backend"
version = "0.1.0"
description = "FastAPI backend for the reusable FastAPI and Vue project template."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncmy>=0.2,<1.0",
    "cryptography>=43,<47",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "redis>=5,<8",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
